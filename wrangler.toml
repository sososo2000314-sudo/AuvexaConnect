[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "auvexaconnect-db"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"
migrations_dir = "db/migrations"
