<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10101b"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css">
<title>AuvexaConnect</title>
</head>
<body>
<header><div class="brand"><span class="logo">A</span><span>AuvexaConnect</span></div><div id="clock"></div></header>
<main>
<section id="maintenance" class="panel hidden"><h1>ただいまメンテナンス中です</h1><p>ご不便をおかけします。</p><p id="maintenanceMessage"></p></section>
<section id="auth" class="panel">
<h1>ようこそ</h1><p>ゲストとして閲覧するか、ユーザー名とパスワードでログインできます。</p>
<div class="tabs"><button data-tab="login" class="selected">ログイン</button><button data-tab="register">新規登録</button></div>
<form id="authForm"><label>ユーザー名<input name="username" minlength="3" maxlength="24" required autocomplete="username"></label>
<label>パスワード<input name="password" type="password" minlength="10" required autocomplete="current-password"></label>
<label id="displayWrap" class="hidden">表示名<input name="displayName" maxlength="40"></label>
<button class="primary" type="submit" id="authSubmit">ログイン</button></form>
<button id="guest" class="secondary">ゲストとして見る</button><p id="authMessage" role="status"></p>
</section>
<section id="app" class="hidden">
<nav class="nav"><button data-page="feed" class="selected">ホーム</button><button data-page="profile">マイページ</button><button data-page="notifications">通知</button><button data-page="settings">設定</button></nav>
<section id="feed" class="page panel"><h1>ホーム</h1><form id="postForm"><textarea name="body" maxlength="2000" placeholder="いま何をしていますか？"></textarea><input name="mediaUrl" type="url" placeholder="画像・動画URL（任意）"><button class="primary">投稿する</button></form><div id="posts"></div></section>
<section id="profile" class="page panel hidden"><h1>マイページ</h1><div id="profileInfo"></div><form id="profileForm"><label>表示名<input name="displayName" maxlength="40"></label><label>自己紹介<textarea name="bio" maxlength="300"></textarea></label><label>プロフィール画像URL<input name="avatarUrl" type="url"></label><label>言語<select name="language"><option value="ja">日本語</option><option value="en">English</option></select></label><button class="primary">保存</button></form></section>
<section id="notifications" class="page panel hidden"><h1>通知センター</h1><div id="notificationList"></div></section>
<section id="settings" class="page panel hidden"><h1>設定</h1><p>アカウント情報、言語、通知、管理パネルへの入口。</p><p id="account"></p><button id="admin" class="secondary">管理パネル</button><button id="logout" class="danger">ログアウト</button><div id="adminPanel" class="hidden"><h2>管理パネル</h2><label><input id="maintenanceToggle" type="checkbox"> メンテナンスを有効にする</label><textarea id="maintenanceText">ただいまメンテナンス中です。ご不便をおかけします。</textarea><button id="saveMaintenance" class="primary">メンテナンス設定を保存</button><p id="adminMessage"></p></div></section>
</section>
</main><footer> AuvexaConnect · 共通PWA </footer><script src="/app.js"></script>
</body></html>
