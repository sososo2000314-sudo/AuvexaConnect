<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>AuvexaConnect</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/profile.css">
  <link rel="stylesheet" href="/css/video.css">
  <link rel="stylesheet" href="/css/messages.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home"><span class="brand-mark">A</span><span>AuvexaConnect</span></a>
      <input id="global-search" class="search" placeholder="動画・ユーザー・板を検索..." aria-label="検索">
      <button id="profile-shortcut" class="avatar" aria-label="マイページ">ゲ</button>
    </header>
    <aside class="sidebar" id="sidebar">
      <button data-page="home" class="nav-item active">⌂ <span>ホーム</span></button>
      <button data-page="videos" class="nav-item">▶ <span>動画</span></button>
      <button data-page="messages" class="nav-item">✉ <span>メール</span></button>
      <button data-page="friends" class="nav-item">♧ <span>フレンド</span></button>
      <button data-page="boards" class="nav-item">▤ <span>板</span></button>
      <button data-page="profile" class="nav-item">◉ <span>マイページ</span></button>
    </aside>
    <main id="app-main" class="main-content">
      <section class="welcome-card">
        <p class="eyebrow">YOUR SOCIAL SPACE</p>
        <h1>AuvexaConnectへようこそ</h1>
        <p>動画・投稿・メッセージ・フレンドをひとつに。</p>
        <button class="primary-button" id="start-button">続ける</button>
      </section>
      <section class="section">
        <h2>ショート動画</h2>
        <div class="empty-state">ショート動画はまだありません。</div>
      </section>
      <section class="section">
        <h2>おすすめの投稿</h2>
        <div class="empty-state">投稿はまだありません。</div>
      </section>
    </main>
    <nav class="bottom-nav" id="bottom-nav">
      <button data-page="home" class="active">⌂<small>ホーム</small></button>
      <button data-page="videos">▶<small>動画</small></button>
      <button data-page="messages">✉<small>メール</small></button>
      <button data-page="friends">♧<small>フレンド</small></button>
      <button data-page="boards">▤<small>板</small></button>
      <button data-page="profile">◉<small>マイページ</small></button>
    </nav>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
