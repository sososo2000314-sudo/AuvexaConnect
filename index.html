<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>AuvexaConnect</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
<header class="top"><div class="brand">🌐 AuvexaConnect</div><div class="topright"><span id="clock"></span><span id="uptime">Cloudflare Workers</span></div></header>
<main id="main"><section class="hero"><h1>AuvexaConnect</h1><p>世界とつながる、交流・学習・コミュニケーションプラットフォーム。</p><div class="authgrid"><form id="loginForm" class="panel"><h2>ログイン</h2><input name="email" type="email" placeholder="メールアドレス" required><input name="password" type="password" placeholder="パスワード" required><button>ログイン</button></form><form id="registerForm" class="panel"><h2>新規登録</h2><input name="displayName" placeholder="表示名" maxlength="40" required><input name="email" type="email" placeholder="メールアドレス" required><input name="password" type="password" minlength="10" placeholder="パスワード（10文字以上）" required><button>アカウント作成</button></form></div><p id="authMessage" class="message"></p></section></main>
</div>
<div id="toast" role="status"></div>
<script src="/app.js"></script>
</body></html>
